name: windows-exe

# Two jobs in one: every master push builds and smoke-tests the exe as a
# throwaway artifact, and pushing a v* tag additionally attaches it to a
# GitHub Release. The release is what the README links to -- build
# artifacts expire, need a login, and have no stable URL, so they are not
# something to send a user at.
#
# No `paths:` filter. Path filters are not applied to tag pushes the way
# they are to branch pushes, and a release that silently doesn't build is
# worse than a couple of wasted CI minutes on a docs-only commit.

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # needed for `gh release`

# Actions are pinned by commit SHA, not by tag. A tag is mutable, and this
# workflow has contents: write and produces the binary people download.
# The trailing comment is the human-readable version; the SHA is what runs.

jobs:
  # The exe smoke test only proves argparse runs. Every tag write goes
  # through probe._atomic_save, whose fsync would have failed on Windows
  # while passing on Linux -- so the suite has to actually run here.
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ffmpeg and flac
        run: choco install ffmpeg flac -y --no-progress
      - name: Install tagfill
        run: pip install -e .[network,test]
      - name: Build fixtures
        run: python tests/make_fixtures.py
      - name: Run the suite on Windows
        run: pytest tests/ -q

  build:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install tagfill and its network extras
        run: |
          pip install -e .[network]
          # Pinned: the shipped binary should not depend on whatever PyPI
          # served that morning.
          pip install pyinstaller==6.22.2

      - name: Build tagfill.exe
        run: pyinstaller packaging/tagfill.spec --distpath dist --workpath build

      - name: Smoke test
        run: |
          dist/tagfill.exe --version
          mkdir empty-music-dir
          dist/tagfill.exe --music-dir empty-music-dir --report

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tagfill-windows
          path: dist/tagfill.exe

      # Unsigned, so SmartScreen will warn. Until signing is worth the
      # cost, publish a checksum people can actually check.
      - name: Checksum
        run: |
          $h = (Get-FileHash dist/tagfill.exe -Algorithm SHA256).Hash.ToLower()
          "$h  tagfill.exe" | Out-File -Encoding ascii dist/SHA256SUMS
          Get-Content dist/SHA256SUMS

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/tagfill.exe dist/SHA256SUMS --generate-notes --title "$env:GITHUB_REF_NAME"
