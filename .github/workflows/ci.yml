name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg flac
      - run: pip install -e .[network,test] ruff
      - run: ruff check tagfill/ tests/ packaging/
      - run: python tests/make_fixtures.py
      - run: pytest tests/ -q
