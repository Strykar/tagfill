name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    # pyproject says >=3.11, so 3.11 has to be tested or the floor is a
    # guess. macOS is here for the same reason the Windows job exists: the
    # os.chown crash shipped because nothing but Linux ever ran a write.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12", lint: true}
          - {os: macos-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg flac
      - if: runner.os == 'macOS'
        run: brew install ffmpeg flac
      - run: pip install -e .[network,test] ruff
      - if: matrix.lint
        run: ruff check tagfill/ tests/ packaging/
      - run: python tests/make_fixtures.py
      - run: pytest tests/ -q
      # CPython's own detector for the bug class that would have taken down
      # every Windows run on a non-ASCII collection: a text handle with no
      # encoding= takes the ANSI code page there. The warning fires on any
      # platform, so one Linux leg is enough to keep it from coming back.
      - if: matrix.lint
        run: python -X warn_default_encoding -W error::EncodingWarning -m pytest tests/ -q
