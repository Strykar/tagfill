[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagfill"
version = "0.1.0"
description = "Fix music metadata and album art in place, without moving your files"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.46",
]

[project.optional-dependencies]
# The offline stages (census, convert, art-local, filename, report) need only
# mutagen plus the external binaries (ffmpeg, flac). The network stages need:
network = [
    "requests>=2.28",
    "musicbrainzngs>=0.7",
    "pillow>=9.0",
]
test = ["pytest>=7", "requests-mock>=1.11"]

[project.scripts]
tagfill = "tagfill.cli:main"

[tool.setuptools.packages.find]
include = ["tagfill*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PIE", "C4"]
# Deliberate here, not oversights:
#   BLE001 catching Exception broadly is the resilience pattern -- a source
#          lookup, an art fetch or a tag write that fails must journal the
#          reason and let the batch continue, never take the run down.
#   PLW1510 every subprocess.run checks returncode explicitly, because the
#          stderr is wanted for the journal rather than a traceback.
#   S110/S112 try/except/continue is that same pattern at the loop level.
ignore = ["BLE001", "PLW1510", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
# Tests put sys.path.insert before the package imports on purpose.
"tests/*" = ["E402"]
# PyInstaller injects SPECPATH, Analysis, PYZ and EXE at exec time.
"packaging/tagfill.spec" = ["F821"]
